<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="PROTEORA: a verdict with its evidence, and a stated refusal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a51"/><stop offset="1" stop-color="#140f2e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- alpha helix, left -->
  <g fill="none" stroke-linecap="round" transform="translate(56 84) scale(2.5)">
    <path d="M46 18.5 A14 7 0 0 1 18 23 M46 27.5 A14 7 0 0 1 18 32 M46 36.5 A14 7 0 0 1 18 41"
          stroke="#6456b0" stroke-width="3.6"/>
    <path d="M18 14 A14 7 0 0 1 46 18.5 M18 23 A14 7 0 0 1 46 27.5 M18 32 A14 7 0 0 1 46 36.5 M18 41 A14 7 0 0 1 46 45.5"
          stroke="#d6cffa" stroke-width="5"/>
  </g>
  <circle cx="136" cy="160" r="14" fill="#241a51" stroke="#ffd166" stroke-width="8"/>

  <!-- verdict lines, right -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="250" y="96" fill="#8d86a8" font-size="17" font-weight="600" letter-spacing="2.4">ONE SUBSTITUTION</text>

    <rect x="250" y="120" width="330" height="54" rx="10" fill="#1d2f26" stroke="#2f5c45"/>
    <text x="268" y="144" fill="#5ad19a" font-size="17" font-weight="800" letter-spacing="1">SUPPORTED</text>
    <text x="268" y="164" fill="#9fb8ab" font-size="14">with the rows it used</text>

    <rect x="250" y="186" width="330" height="54" rx="10" fill="#33202a" stroke="#6b3240"/>
    <text x="268" y="210" fill="#ff8a94" font-size="17" font-weight="800" letter-spacing="1">CONTRADICTED</text>
    <text x="268" y="230" fill="#c49aa2" font-size="14">reported as readily as support</text>

    <rect x="250" y="252" width="330" height="54" rx="10" fill="#332a16" stroke="#6d5a24"/>
    <text x="268" y="276" fill="#ffcf66" font-size="17" font-weight="800" letter-spacing="1">INSUFFICIENT</text>
    <text x="268" y="296" fill="#c3b48b" font-size="14">and what would settle it</text>
  </g>
</svg>
